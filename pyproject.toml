[project]
name = "investagents"
version = "0.1.0"
description = "Comité d'agents IA pour évaluer et sélectionner des projets d'investissement (projets Banque mondiale, vérité terrain IEG)."
readme = "README.md"
authors = [{ name = "frikaya12" }]
requires-python = ">=3.12"
dependencies = [
    "en-core-web-sm",
    "geonamescache>=3.0.2",
    "langgraph>=1.2.22",
    "ortools>=9.15.6755",
    "pandas>=3.1.1",
    "plotly>=7.1.0",
    "pyarrow>=26.0.1",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "sentence-transformers>=6.3.0",
    "spacy>=3.8.18",
    "streamlit>=1.67.0",
    "tabulate>=0.10.0",
]

[dependency-groups]
dev = [
    "markdown-it-py>=4.3.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
    "scipy>=1.18.1",
]

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
# notebooks Kaggle générés par committee_run/make_kernel.py (cellules shell « ! »)
extend-exclude = ["kaggle"]

[tool.ruff.lint]
# E/F : erreurs de base ; I : tri des imports ; B : bugs fréquents ; UP : syntaxe Python moderne
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Les tests qui appellent les vraies API sont marqués « network » et exclus par défaut.
addopts = "-m 'not network'"
markers = ["network: appelle une vraie API sur Internet (lancer avec -m network)"]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
