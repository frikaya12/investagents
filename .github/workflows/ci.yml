name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Installer Python et les dépendances
        run: uv sync --python 3.12
      - name: Lint (Ruff)
        run: uv run ruff check .
      - name: Tests (sans réseau)
        run: uv run pytest
