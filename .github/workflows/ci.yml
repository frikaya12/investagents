name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # historique complet : un test vérifie les commits cités comme preuves
      - uses: astral-sh/setup-uv@v6
      - name: Installer Python et les dépendances
        run: uv sync --python 3.12
      - name: Lint (Ruff)
        run: uv run ruff check .
      - name: Tests (sans réseau)
        shell: bash
        run: |
          set -o pipefail
          uv run pytest -rf 2>&1 | tee pytest.log
      - name: Tests en échec (annotations lisibles sur la page de la CI)
        if: failure()
        shell: bash
        run: grep -E '^(FAILED|ERROR) ' pytest.log | cut -c1-300 | sed 's/^/::error::/' || true
